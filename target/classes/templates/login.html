<!doctype html><html lang="hy" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Մուտք | SocialBridge')}"></head><body>
<nav th:replace="~{fragments :: nav}"></nav><main class="auth-page"><section class="form-card auth-card">
<span class="eyebrow">ԲԱՐԻ ՎԵՐԱԴԱՐՁ</span><h1>Մուտք</h1><p class="text-muted">Շարունակեք ձեր SocialBridge հաշվում։</p>
<div class="alert alert-success" th:if="${param.registered}">Ձեր հաշիվը պատրաստ է։ Խնդրում ենք մուտք գործել։</div>
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<form method="post" th:action="@{/login}"><label for="username">Օգտանուն կամ էլ․ փոստ</label><input class="form-control" id="username" name="username" required autocomplete="username">
<label for="password">Գաղտնաբառ</label><input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
<button class="btn btn-primary w-100 mt-4">Մուտք</button></form>
<p class="mt-4 mb-0">Առաջի՞ն անգամ եք այստեղ։ <a th:href="@{/register}">Ստեղծել հաշիվ</a></p>
</section></main><footer th:replace="~{fragments :: footer}"></footer><div th:replace="~{layout :: scripts}"></div></body></html>
