<!doctype html><html lang="hy" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Իմ հաշիվը | SocialBridge')}"></head><body>
<nav th:replace="~{fragments :: nav}"></nav><main class="container py-5 account-page">
<span class="eyebrow">ԻՄ ՀԱՇԻՎԸ</span><h1>Բարև, <span th:text="${user.name}">ընկեր</span> 👋</h1>
<p class="lead">Բարի գալուստ ձեր SocialBridge-ի էջ։</p>
<div class="contact-card my-4"><h2>Ձեր տվյալները</h2><p><strong>Օգտանուն՝</strong> <span th:text="${user.username}"></span></p><p><strong>Էլ․ փոստ՝</strong> <span th:text="${user.email}"></span></p></div>
<a class="btn btn-primary" th:href="@{/services}">Ուսումնասիրել աջակցությունը</a>
<form class="d-inline" method="post" th:action="@{/logout}"><button class="btn btn-outline-primary ms-2">Դուրս գալ</button></form>
</main><footer th:replace="~{fragments :: footer}"></footer><div th:replace="~{layout :: scripts}"></div></body></html>
