spring.application.name=Social Support
server.port=8080

# Uses a local file by default; MySQL settings can be supplied through environment variables.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/social_support;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false
server.forward-headers-strategy=framework
