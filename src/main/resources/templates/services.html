<!doctype html>
<html lang="hy" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout :: head('Ծառայություններ | SocialBridge')}">
    </head>
    <body>
        <nav th:replace="~{fragments :: nav}">
        </nav>
        <section class="page-hero compact">
            <div class="container">
                <span class="eyebrow">
                    ԾԱՌԱՅՈՒԹՅՈՒՆՆԵՐԻ ՑԱՆԿ
                </span>
                <h1>
                    Աջակցություն՝ ձեր իրավիճակին համապատասխան։
                </h1>
                <form class="search-box mt-4" method="get">
                    <i class="bi bi-search">
                    </i>
                    <input name="q" placeholder="Որոնել ծառայություններ..." th:value="${query}">
                    <button class="btn btn-primary">
                        Որոնել
                    </button>
                </form>
            </div>
        </section>
        <main class="container py-5">
            <p class="text-muted" th:if="${query}" th:text="|Որոնել results for “${query}”|">
            </p>
            <div class="row g-4" th:if="${!services.empty}">
                <div class="col-md-6 col-lg-4" th:each="service : ${services}">
                    <article class="service-card h-100">
                        <div class="icon-bubble">
                            <i th:class="|bi ${service.icon}|">
                            </i>
                        </div>
                        <span class="category" th:text="${service.category}">
                        </span>
                        <h3 th:text="${service.name}">
                        </h3>
                        <p th:text="${service.summary}">
                        </p>
                        <a class="stretched-link" th:href="@{/services/{slug}(slug=${service.slug})}">
                            Իմանալ ավելին
                            <i class="bi bi-arrow-right">
                            </i>
                        </a>
                    </article>
                </div>
            </div>
            <div class="empty-state" th:if="${services.empty}">
                <i class="bi bi-search">
                </i>
                <h3>
                    Ձեր որոնմանը համապատասխան ծառայություն չի գտնվել։
                </h3>
                <a th:href="@{/services}" class="btn btn-primary">
                    Մաքրել որոնումը
                </a>
            </div>
        </main>
        <footer th:replace="~{fragments :: footer}">
        </footer>
        <div th:replace="~{layout :: scripts}">
        </div>
    </body>
</html>
